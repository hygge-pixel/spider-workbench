name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
jobs:
  framework:
    name: framework-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/check_public_release.py
      - run: python scripts/run_full_regression.py
      - run: python scripts/release.py --output outputs/releases
  mcp-build:
    name: mcp-source-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: vendor/js-reverse-mcp
      - run: npm run prepare
        working-directory: vendor/js-reverse-mcp
      - run: npm run build
        working-directory: vendor/js-reverse-mcp
      - run: python scripts/browser_toolchain.py mcp-smoke --candidate chrome --stdio-only
